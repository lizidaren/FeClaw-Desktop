[package]
name = "feclaw-desktop"
version = "0.1.0"
description = "FeClaw Desktop - Windows native client for FeClaw AI Agent engine"
authors = ["lizidaren"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "feclaw_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["connect", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rfd = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
toml = "0.8"
futures-util = "0.3"
log = "0.4"
open = "5"
auto-launch = "0.5"
dirs = "5"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
urlencoding = "2"
walkdir = "2"
qrcode = "0.14"
image = "0.25"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[features]
global-shortcut = ["tauri-plugin-global-shortcut"]
windows-hwnd = []
custom-protocol = ["tauri/custom-protocol"]
