<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>欢迎使用 FeClaw</title>
  <link rel="stylesheet" href="welcome.css" />
</head>
<body>
  <div class="page">
    <header class="hero">
      <div class="hero-mark" aria-hidden="true">F</div>
      <h1>FeClaw</h1>
      <p class="subtitle">你的 AI 即时通讯</p>
    </header>

    <main class="login-form" id="login-form">
      <div class="form-group">
        <label for="username">邮箱 / 用户名</label>
        <input
          id="username"
          type="text"
          placeholder="请输入邮箱或用户名"
          autocomplete="username"
          spellcheck="false"
        />
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input
          id="password"
          type="password"
          placeholder="请输入密码"
          autocomplete="current-password"
        />
      </div>
      <button type="button" class="btn btn-primary" id="btn-login">登 录</button>
    </main>

    <footer class="login-foot">
      <a href="#" id="btn-register">没有账号？注册</a>
      <span class="divider">— 或 —</span>
      <a href="#" id="btn-selfhosted">自建服务 · 本地运行</a>
      <span id="status" class="status" role="status" aria-live="polite"></span>
    </footer>
  </div>

  <script type="module" src="welcome.js"></script>
</body>
</html>
