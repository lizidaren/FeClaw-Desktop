<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FeClaw Desktop</title>
  <link rel="stylesheet" href="chat.css" />
</head>
<body data-theme="system">
  <div class="app">

    <!-- Left Tab Bar -->
    <nav class="tab-bar" id="tab-bar" aria-label="功能导航">
      <button class="tab-btn active" data-tab="chat" title="聊天">
        <span class="tab-icon" aria-hidden="true">💬</span>
        <span class="tab-label">聊天</span>
      </button>
      <button class="tab-btn" data-tab="moments" title="广场">
        <span class="tab-icon" aria-hidden="true">📱</span>
        <span class="tab-label">广场</span>
      </button>
      <button class="tab-btn" data-tab="fehub" title="FeHub">
        <span class="tab-icon" aria-hidden="true">🏗️</span>
        <span class="tab-label">FeHub</span>
      </button>
      <button class="tab-btn" data-tab="profile" title="我的">
        <span class="tab-icon" aria-hidden="true">🙋</span>
        <span class="tab-label">我的</span>
      </button>
      <button class="tab-btn" data-tab="settings" title="设置">
        <span class="tab-icon" aria-hidden="true">⚙</span>
        <span class="tab-label">设置</span>
      </button>
    </nav>

    <!-- Middle: Chat List Panel -->
    <aside class="chat-list-panel" id="chat-list-panel">
      <header class="panel-header">
        <h2 class="panel-title" id="panel-title">聊天</h2>
        <button type="button" class="icon-btn" id="btn-new-chat" title="新建聊天">+</button>
      </header>
      <div class="chat-list" id="chat-list" role="listbox" aria-label="聊天列表">
        <!-- Chat items populated by JS -->
        <div class="empty-list-hint" id="empty-list-hint">
          <span>暂无聊天</span>
          <small>从右侧选择一个 Agent 开始对话</small>
        </div>
      </div>

      <!-- Moments Feed (shown when tab=moments) -->
      <div class="moments-feed" id="moments-feed" style="display:none;">
        <div class="moments-filter-bar">
          <select class="moments-group-filter" id="moments-group-filter">
            <option value="">全部群</option>
          </select>
        </div>
        <div class="moments-list" id="moments-list" role="listbox" aria-label="动态列表">
          <div class="moments-empty" id="moments-empty">暂无动态</div>
        </div>
      </div>

      <!-- FeHub Panel (shown when tab=fehub) -->
      <div class="fehub-panel" id="fehub-panel" style="display:none;">
        <div class="fehub-header">
          <h2 class="panel-title">🏗️ FeHub</h2>
        </div>
        <div class="fehub-content" id="fehub-content"></div>
      </div>
    </aside>

    <!-- Right: Chat Window Panel -->
    <main class="chat-window-panel" id="chat-window-panel">
      <!-- No chat selected state -->
      <div class="no-chat-state" id="no-chat-state">
        <div class="no-chat-icon" aria-hidden="true">F</div>
        <h2>选择一个 Agent 开始聊天</h2>
        <p>从左侧列表选择一个 AI 助理，即可开始对话</p>
      </div>

      <!-- Placeholder page (shown when FE Hub / Plaza tab is active) -->
      <div class="placeholder-page" id="placeholder-page" style="display:none;">
        <div class="placeholder-icon" id="placeholder-icon" aria-hidden="true">🔧</div>
        <h2 class="placeholder-title" id="placeholder-title">FE 中心</h2>
        <p class="placeholder-subtitle" id="placeholder-subtitle">功能开发中，敬请期待…</p>
      </div>

      <!-- Active chat -->
      <div class="active-chat" id="active-chat" style="display:none;">
        <header class="chat-header" id="chat-header">
          <div class="chat-header-info">
            <div class="chat-avatar" id="chat-avatar" aria-hidden="true">A</div>
            <div class="chat-header-text">
              <div class="chat-name" id="chat-name">Agent</div>
              <div class="chat-status" id="chat-status">
                <span class="conn-dot" id="conn-dot"></span>
                <span class="conn-text" id="conn-text">在线</span>
              </div>
            </div>
          </div>
          <div class="chat-header-actions">
            <button type="button" class="icon-btn" id="btn-chat-menu" title="更多">⋮</button>
          </div>
        </header>

        <div class="messages" id="messages" aria-live="polite">
          <!-- Messages rendered by JS -->
        </div>

        <footer class="composer">
          <textarea
            id="input"
            class="input"
            rows="1"
            placeholder="输入消息，按 Enter 发送（Shift+Enter 换行）"
            autocomplete="off"
            spellcheck="false"
          ></textarea>
          <button type="button" class="btn btn-primary" id="btn-send">发送</button>
        </footer>
      </div>

      <!-- Settings Tab (embedded panel, shown when tab=settings) -->
      <div class="settings-tab" id="settingsTab" style="display:none;">
        <iframe id="settings-frame" src="/settings/index.html" style="width:100%;height:100%;border:none;"></iframe>
      </div>
    </main>

  </div>

  <!-- Create Agent Dialog -->
  <div id="createAgentOverlay" class="modal-overlay" style="display:none;">
    <div class="modal-card" style="max-width:400px;">
      <div class="modal-header">
        <h3>创建新 Agent</h3>
        <button class="modal-close" onclick="closeCreateDialog()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>名称</label>
          <input type="text" id="agentNameInput" placeholder="输入 Agent 名称..." maxlength="50">
        </div>
        <div class="form-group">
          <label>类型</label>
          <select id="agentTypeSelect">
            <option value="classic">经典 Agent</option>
            <option value="im">即时通讯 Agent</option>
          </select>
        </div>
        <div id="createAgentError" class="text-danger" style="display:none;"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeCreateDialog()">取消</button>
        <button class="btn btn-primary" onclick="submitCreateAgent()">创建并配置</button>
      </div>
    </div>
  </div>

  <!-- Profile Panel (left sidebar extended view) -->
  <div class="profile-panel" id="profile-panel" style="display:none;">
    <h2>我的</h2>
    <div class="profile-info" id="profile-info">
      <!-- username, permissions summary -->
    </div>
    <div class="permission-summary" id="permission-summary">
      <!-- per-agent permission list -->
    </div>
  </div>

  <!-- Search Overlay (Phase 7) -->
  <div class="search-overlay" id="search-overlay" style="display:none;">
    <div class="search-backdrop" id="search-backdrop"></div>
    <div class="search-panel">
      <div class="search-header">
        <div class="search-icon" aria-hidden="true">🔍</div>
        <input
          type="text"
          class="search-input"
          id="search-input"
          placeholder="搜索聊天、文件、动态..."
          autocomplete="off"
          spellcheck="false"
        />
        <button type="button" class="search-close" id="search-close" title="关闭 (Esc)">✕</button>
      </div>
      <div class="search-tabs" id="search-tabs">
        <button class="search-tab active" data-source="all">全部</button>
        <button class="search-tab" data-source="chat">💬 聊天</button>
        <button class="search-tab" data-source="vfs">📁 文件</button>
        <button class="search-tab" data-source="moments">📱 动态</button>
      </div>
      <div class="search-results" id="search-results">
        <div class="search-empty" id="search-empty">
          <span>输入关键词开始搜索</span>
        </div>
      </div>
      <div class="search-footer" id="search-footer" style="display:none;">
        <span id="search-stats"></span>
      </div>
    </div>
  </div>

  <!-- Moments toast notification -->
  <div class="moments-toast" id="moments-toast" style="opacity:0;">新动态</div>

  <!-- Avatar upload: hidden file input -->
  <input type="file" id="avatar-file-input" accept="image/*" hidden>

  <!-- Avatar preview modal -->
  <div id="avatar-preview-modal" class="avatar-modal-overlay" style="display:none;">
    <div class="avatar-modal-card">
      <div class="avatar-modal-header">
        <h3>更换头像</h3>
        <button class="modal-close" id="avatar-cancel-btn">✕</button>
      </div>
      <div class="avatar-compare">
        <div class="avatar-compare-item">
          <p class="avatar-compare-label">当前头像</p>
          <div class="avatar-compare-box" id="avatar-old-box"></div>
        </div>
        <div class="avatar-arrow">→</div>
        <div class="avatar-compare-item">
          <p class="avatar-compare-label">新头像</p>
          <div class="avatar-compare-box">
            <img id="avatar-preview-img" src="" alt="预览">
          </div>
        </div>
      </div>
      <div class="avatar-modal-footer">
        <button class="btn btn-secondary" id="avatar-cancel-btn-2">取消</button>
        <button class="btn btn-primary" id="avatar-confirm-btn">确认</button>
      </div>
    </div>
  </div>

  <script type="module" src="chat.js"></script>
</body>
</html>
